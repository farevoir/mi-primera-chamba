# Daily job scan in the cloud, for a PRIVATE repo that holds your my-data/ folder.
# Copy to <your data repo>/.github/workflows/daily-scan.yml. It checks out the public tool repo,
# runs `jobs.mjs daily` against your data, commits the updated log, and opens an issue every day:
# new postings, or a closed "no new postings" one, which GitHub sends to your email and the GitHub
# mobile app. No AI, no secrets.
#
# Optional repository variable TOOL_REPO (owner/name) if you use a fork of the tool.

name: Daily job scan

on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC = 08:00 in Mexico City. Adjust for your time zone.
  workflow_dispatch:       # "Run workflow" button, for a manual scan

permissions:
  contents: write          # commit the updated log
  issues: write            # notify with an issue

concurrency: daily-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: data
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.TOOL_REPO || 'farevoir/mi-primera-chamba' }}
          path: tool
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Scan target companies
        id: scan
        run: node tool/scripts/jobs.mjs daily
        env:
          DATA_DIR: data

      - name: Save log and state
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push

      - name: Notify
        # New postings: an open issue (the previous one is closed). Nothing new: a closed
        # "no new postings" issue, so the daily email still confirms the scan ran.
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.scan.outputs.new }}
        run: |
          today=$(date -u +%F)
          if [ -n "$NEW" ] && [ "$NEW" != "0" ]; then
            gh label create new-postings --color 1D76DB --description "Daily scan results" --force
            for n in $(gh issue list --label new-postings --state open --json number -q '.[].number'); do
              gh issue close "$n" --reason completed
            done
            gh issue create --label new-postings --title "$NEW new posting(s) — $today" --body-file new-postings.md
          else
            gh label create scan-status --color BFD4F2 --description "Daily scan ran, nothing new" --force
            url=$(gh issue create --label scan-status --title "No new postings — $today" --body-file new-postings.md)
            gh issue close "$url" --reason completed
          fi
